# Tema: jedna datoteka = jedna tema. Slobodno mijenjaj tekst.

naziv: Mirko Filipović (Cro Cop)
opis: >
  Kratka priča o Mirku Filipoviću, hrvatskom borcu poznatom u Japanu
  kao "Mirko Cro Cop". Samo javno poznate činjenice iz sportske karijere:
  rođen u Vinkovcima, bio policajac, kickboks, borbe u Japanu (PRIDE),
  pobjeda na velikom turniru 2006., poznati udarac lijevom nogom (high kick)
  i izreka koju japanski navijači znaju: 右足で病院、左足で墓場.
  Pripovjedač je navijač iz Hrvatske. Bez politike i osobnog života.

gramatika: ～ことができる, pasiv ～られる

