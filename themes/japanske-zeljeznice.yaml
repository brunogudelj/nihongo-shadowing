# Tema: jedna datoteka = jedna tema. Slobodno mijenjaj tekst.

naziv: Shinkansenom od Sappora do Nagasakija
opis: >
  Putovanje vlakom kroz cijeli Japan, od sjevera prema jugu, u prvom licu.
  Iz Sappora običnim vlakom do Hakodatea, zatim shinkansenom: Sendai,
  Tokio, Kanazawa, Fukuoka (Hakata) i na kraju Nagasaki.
  U svakom gradu jedna kratka slika: hrana, pogled kroz prozor, vrijeme, ljudi.
  Kupovina karte, peron, presjedanje, bento u vlaku.

kljucne_rijeci:
  - 電車      # vlak
  - 駅        # stanica
  - 切符      # karta (vozna)
  - 乗り換える # presjedati
  - 窓        # prozor
  - 時間      # vrijeme
  - 北        # sjever
  - 南        # jug

