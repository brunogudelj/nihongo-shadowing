naziv: Hrvatska hrana
opis: >
  Japanskom prijatelju pričam o hrvatskoj hrani, u prvom licu.
  Ćevapi, sarma zimi, burek za doručak, pršut i sir, tartufi u Istri,
  riba i maslinovo ulje u Dalmaciji. Što bih mu preporučio i gdje.

