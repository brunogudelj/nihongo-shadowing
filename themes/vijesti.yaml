# Tema za dnevnu vijest. Ovu datoteku svaki dan iznova piše pipeline/news.mjs; ne mijenjaj je ručno.

naziv: Vijest dana
opis: Kratka vijest iz Hrvatske za učenje japanskog. Izaberi JEDNU vijest s popisa naslova koja je zanimljiva i razumljiva (vrijeme, sport, kultura, turizam, znanost, gospodarstvo, svakodnevni život). Preskoči zločine, nesreće sa žrtvama, rat i političke sukobe.
upute:
  - "Write EXACTLY 5 sentences: a short, simple news report about the chosen headline, in polite form, third person."
  - Retell it in your own words. Do not translate or copy the article text.
  - Use only facts from the headline and summary. Do not invent numbers, names or quotes.
  - Croatian place and person names in katakana (ザグレブ, スプリト).
  - "title_hr: the Croatian headline you chose (shortened if long). title_ja: its short Japanese title."
vec_obradjeno:
  - Dinamo objavio filmić o utakmici s Anderlechtom
naslovi:
  - izvor: Index
    naslov: "PSV izgubio, a Perišić nije igrao. Trener: Za Hrvatsku stalno igra 90 minuta"
    sazetak: IVAN PERIŠIĆ odlukom trenera nije igrao u porazu PSV-a od ADO Den Haaga (2:1).
  - izvor: Index
    naslov: Imamo nove detalje o uhićenim torcidašima, idu u zatvor. Javili se njihovi odvjetnici
    sazetak: POLICIJA nastavlja potragu za pripadnicima Torcide osumnjičenima za nacističke i antisemitske povike tijekom kortea uoči utakmice Hajduka i Ajaxa u Splitu. U državnom odvjetništvu ispitana su trojica uhićenih.
  - izvor: Index
    naslov: VIDEO Hrgović stigao u London na veliki spektakl i borbu za pojas teške kategorije
    sazetak: GLEDAT će meč Wardleyja i Duboisa iz prvih redova.
  - izvor: Index
    naslov: Emiliano Martinez u gadnom sudaru slomio kost u licu. Mora na operaciju
    sazetak: PREMA informacijama iz više britanskih medija, Emiliano Martinez ima slomljenu jagodičnu kost i morat će na operaciju.
  - izvor: Index
    naslov: Ljevica u Berlinu želi nacionalizirati 160.000 stanova i ograničiti stanarine
    sazetak: BERLINSKA koalicija ljevice planira izvlastiti 160.000 stanova velikih tvrtki i ograničiti stanarine.
  - izvor: Index
    naslov: "Talijani: Fabregas bi Baturini mogao dati potpuno novu ulogu"
    sazetak: FABREGAS mora improvizirati zbog ozljeda.
  - izvor: Index
    naslov: Francuski gradovi u plamenu, spaljena povijesna građevina. Reagirao Macron
    sazetak: VELIKI prosvjedi prerasli su u nasilne nerede diljem Francuske. U gradu Limogesu zapaljena je povijesna gradska vijećnica. U Parizu, Lyonu, Marseilleu i drugim gradovima izbili su sukobi s policijom, zapaljeni su automobili i javne zgrade, a trgovine su opljačkane.
  - izvor: Index
    naslov: Lautaro prozvao Brozovića? "Neki su više razmišljali o SP-u nego o Interu"
    sazetak: LAUTARO MARTINEZ kritizirao je bivše suigrače.
  - izvor: Index
    naslov: Moguć je novi štrajk ZET-a. Oglasio se profesor s prava
    sazetak: ARBITRAŽOM je odlučeno da u slučaju štrajka u ZET-u mora raditi 25% zaposlenih. Pravnik Viktor Gotovac upozorava da bi bez preciznog definiranja linija moglo doći do kaosa.
  - izvor: Index
    naslov: "Ivica Puljak: Snimke su otišle po Europi. Split je osramoćen"
