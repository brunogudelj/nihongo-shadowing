# Nakon svakog pusha na main izgradi aplikaciju i objavi je na GitHub Pages.
# Poziva ga i robot "Nova priča" (workflow_call), jer GitHub ne pokreće objavu
# sam kad robot spremi promjene.
name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Ako stigne novi push dok objava traje, stara se prekida.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Najnovije stanje grane (uključuje priču koju je robot upravo spremio).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Testovi prije objave: ako padnu, aplikacija se ne objavljuje.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
