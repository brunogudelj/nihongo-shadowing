# Nova priča s GitHubove stranice: Actions → Nova priča → Run workflow → upiši temu.
# Napravi priču (Claude), furiganu i zvuk (Azure), spremi ih u repo i objavi aplikaciju.
# Ključevi su u Settings → Secrets and variables → Actions.
name: Nova priča

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema: naziv datoteke iz mape themes/ bez .yaml (npr. kyushu)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# Samo jedna nova priča u isto vrijeme; druga čeka da prva završi.
concurrency:
  group: nova-prica
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Priča, furigana i zvuk
        env:
          TEMA: ${{ inputs.tema }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: npm run nova-prica -- "$TEMA"
      - name: Spremi u repo
        env:
          TEMA: ${{ inputs.tema }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Nova priča: $TEMA"
          git pull --rebase
          git push

  # Objava aplikacije s novom pričom.
  deploy:
    needs: story
    uses: ./.github/workflows/deploy.yml
