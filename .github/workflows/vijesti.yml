# Vijest dana: svako jutro uzme naslove s HRT-a i Indexa, Claude napiše 5 rečenica o jednoj vijesti,
# napravi se furigana i zvuk (Azure), spremi u repo i objavi aplikaciju. Vijesti starije od 30 dana se brišu.
# Ručno: Actions → Vijest dana → Run workflow (možeš izabrati model).
name: Vijest dana

on:
  # Svako jutro: uključi se kad se izabere model (makni # ispred dva retka ispod).
  # schedule:
  #   - cron: '43 4 * * *' # oko 6:43 po hrvatskom vremenu (ljeti), 5:43 zimi
  workflow_dispatch:
    inputs:
      model:
        description: 'Model koji piše vijest'
        type: choice
        options: [claude-opus-5-5, claude-haiku-5-5]
        default: claude-opus-5-5

permissions:
  contents: write
  pages: write
  id-token: write

# Dijeli red s "Nova priča", da dva robota ne spremaju u isto vrijeme.
concurrency:
  group: nova-prica
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Naslovi vijesti i brisanje starih
        run: node pipeline/news.mjs
      - name: Vijest, furigana i zvuk
        env:
          STORY_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: npm run nova-prica -- vijesti
      - name: Spremi u repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content themes/vijesti.yaml
          git commit -m "Vijest dana: $(date -u +%F)"
          git pull --rebase
          git push

  deploy:
    needs: news
    uses: ./.github/workflows/deploy.yml
